name: Test and prepare release candidates
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      package:
        description: Build packages (requires reviewed committed compliance bundles)
        type: boolean
        default: false
      version:
        description: Candidate version
        default: 0.1.0
        type: string
permissions:
  contents: read
concurrency:
  group: candidate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-amd64
          - os: windows-2025
            platform: windows-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.0
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Frontend dependencies and production embed
        shell: bash
        run: |
          npm ci --prefix frontend
          python scripts/collect-app-notices.py --check
          bash scripts/build-frontend.sh
          node --test frontend/tests/*.test.mjs
      - name: Go unit and integration tests
        shell: bash
        run: |
          go test ./...
          go vet ./...
          go test -race ./internal/app ./internal/packages ./internal/download ./internal/runtime/kiwix
      - name: Packaging safety tests
        run: python -m unittest discover -s scripts/tests -v
      - name: Compile application
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOAMD64: v1
        run: go build -trimpath -o candidate/ ./cmd/engelsiz
      - name: Compile installer definition with non-release fixture
        if: runner.os == 'Windows'
        run: python scripts/check-installer.py --app candidate/engelsiz.exe
      - name: Build verified distributable package
        if: github.event_name == 'workflow_dispatch' && inputs.package
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            export PATH="/c/Program Files (x86)/Inno Setup 6:$PATH"
          fi
          python scripts/release.py --platform "$RELEASE_PLATFORM" --download-runtime --compliance "third_party/compliance/$RELEASE_PLATFORM" --output "release-output" --version "$RELEASE_VERSION"
      - name: Upload reviewable packages and checksums
        if: github.event_name == 'workflow_dispatch' && inputs.package
        uses: actions/upload-artifact@v4
        with:
          name: engelsiz-${{ matrix.platform }}-candidate
          path: release-output/*
          if-no-files-found: error
          retention-days: 14
