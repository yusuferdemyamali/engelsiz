name: Test and prepare release candidates
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      package:
        description: Build packages (audited source-built runtimes + alpha.3-materialized compliance; gates intact)
        type: boolean
        default: false
      qa_installer_url:
        description: Fallback installer URL for QA when the platform job produced none (empty fails closed with a clear error; never silently QA an old release)
        type: string
        default: ''
      version:
        description: Candidate version
        default: 0.1.0
        type: string
permissions:
  contents: read
concurrency:
  group: candidate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-amd64
          - os: windows-2025
            platform: windows-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.0
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Frontend dependencies and production embed
        shell: bash
        run: |
          npm ci --prefix frontend
          python scripts/collect-app-notices.py --check
          bash scripts/build-frontend.sh
          node --test frontend/tests/*.test.mjs
      - name: Go unit and integration tests
        shell: bash
        run: |
          go test ./...
          go vet ./...
          go test -race ./internal/app ./internal/packages ./internal/download ./internal/runtime/kiwix
      - name: Packaging safety tests
        run: python -m unittest discover -s scripts/tests -v
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build frozen translation runtime
        shell: bash
        run: |
          python scripts/translation/build_runtime.py --output translation-runtime-dist --python-license scripts/translation/CPYTHON-3.11-LICENSE.txt
      - name: Upload native translation runtime
        uses: actions/upload-artifact@v4
        with:
          name: translation-runtime-${{ matrix.platform }}
          path: translation-runtime-dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Compile application
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOAMD64: v1
        run: go build -trimpath -o candidate/ ./cmd/engelsiz
      - name: Provision Inno Setup (pinned)
        if: runner.os == 'Windows'
        run: choco install innosetup --version=6.7.1 -y --no-progress
      - name: Compile installer definition with non-release fixture
        if: runner.os == 'Windows'
        run: python scripts/check-installer.py --app candidate/engelsiz.exe
      - name: Materialize compliance from alpha.3 assets
        if: github.event_name == 'workflow_dispatch' && inputs.package
        timeout-minutes: 25
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          SRC="third_party/compliance/${{ matrix.platform }}"
          rm -rf "$SRC"
          mkdir -p "$SRC"
          if [ "${{ matrix.platform }}" = linux-amd64 ]; then
            gh release download v0.1.0-alpha.3 --pattern 'engelsiz-linux-x64.tar.gz' --output "$RUNNER_TEMP/alpha3-linux.tar.gz" --clobber
            mkdir -p "$RUNNER_TEMP/alpha3root"
            tar -xzf "$RUNNER_TEMP/alpha3-linux.tar.gz" -C "$RUNNER_TEMP/alpha3root" engelsiz/LICENSES/runtime-corresponding-source
            cp -a "$RUNNER_TEMP/alpha3root/engelsiz/LICENSES/runtime-corresponding-source/." "$SRC/"
          else
            # The 228 MB Windows corresponding-source bundle cannot live in
            # git, and neither 7-Zip nor innoextract 1.9 can open an Inno 6.5
            # setup (silent install hangs: orphan setup processes observed).
            # Fetch the reviewed bundle published as a prerelease asset
            # (anonymous download; draft assets are invisible to CI tokens).
            # release.py still hash-checks every file against the pinned
            # manifest; a wrong bundle fails closed here and there.
            curl -fsSL -o "$RUNNER_TEMP/win-compliance.tar.gz" "https://github.com/yusuferdemyamali/engelsiz/releases/download/v0.1.0-alpha.4/windows-compliance-bundle.tar.gz"
            mkdir -p "$RUNNER_TEMP/wincomp"
            # Windows RUNNER_TEMP is D:\... — GNU tar reads "D:" as remote host.
            # cygpath strips the drive-colon so tar treats it as local file.
            TMP_UNIX="$(cygpath -u "$RUNNER_TEMP")"
            tar -xzf "$TMP_UNIX/win-compliance.tar.gz" -C "$TMP_UNIX/wincomp"
            cp -a "$TMP_UNIX/wincomp/compliance/." "$SRC/"
          fi
          test -f "$SRC/manifest.json" || { echo 'compliance materialization failed'; exit 1; }
      - name: Build verified distributable package
        if: github.event_name == 'workflow_dispatch' && inputs.package
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            export PATH="/c/Program Files (x86)/Inno Setup 6:$PATH"
          fi
          RUNTIME_DIR="translation-runtime-dist/translation-runtime-linux-amd64"
          RUNTIME_LOCK="third_party/runtime-source-candidates/offline-maps/linux-amd64/candidate-runtime-lock.json"
          RUNTIME_ARCHIVE="third_party/runtime-archives/kiwix-tools_linux-x86_64-3.8.2-known-source.tar.gz"
          if [ "$RUNNER_OS" = Windows ]; then
            RUNTIME_DIR="translation-runtime-dist/translation-runtime-windows-amd64"
            RUNTIME_LOCK="third_party/runtime-source-candidates/offline-maps/windows-amd64/candidate-runtime-lock.json"
            RUNTIME_ARCHIVE="third_party/runtime-archives/kiwix-tools_windows-x86_64-3.8.2-known-source.zip"
          fi
          # Both platforms use audited source-built runtimes: committed exact
          # archives + candidate locks, always hash-checked by release.py.
          # No network drift, no silent upgrades.
          python scripts/release.py --platform "$RELEASE_PLATFORM" --runtime-lock "$RUNTIME_LOCK" --runtime-archive "$RUNTIME_ARCHIVE" --download-pmtiles --translation-runtime "$RUNTIME_DIR" --compliance "third_party/compliance/$RELEASE_PLATFORM" --output "release-output" --version "$RELEASE_VERSION"
      - name: Write build provenance
        if: github.event_name == 'workflow_dispatch' && inputs.package
        shell: bash
        run: |
          ARTIFACT=""
          for f in release-output/Engelsiz-Setup.exe release-output/engelsiz-linux-x64.tar.gz; do
            if [ -f "$f" ]; then ARTIFACT="$f"; break; fi
          done
          test -n "$ARTIFACT" || { echo 'no built artifact for provenance'; exit 1; }
          python scripts/write-build-provenance.py --platform "${{ matrix.platform }}" --version "${{ inputs.version }}" --artifact "$ARTIFACT" --compliance "third_party/compliance/${{ matrix.platform }}" --out "provenance-output/build-provenance.json"
      - name: Upload build provenance
        if: github.event_name == 'workflow_dispatch' && inputs.package
        uses: actions/upload-artifact@v4
        with:
          name: build-provenance-${{ matrix.platform }}
          path: provenance-output/build-provenance.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload reviewable packages and checksums
        if: github.event_name == 'workflow_dispatch' && inputs.package
        uses: actions/upload-artifact@v4
        with:
          name: engelsiz-${{ matrix.platform }}-candidate
          path: release-output/*
          if-no-files-found: error
          retention-days: 14
  installer-qa:
    needs: [platform]
    if: github.event_name == 'workflow_dispatch' && inputs.package
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download Windows installer artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: engelsiz-windows-amd64-candidate
          path: installer-artifact
      - name: Fall back to explicit installer URL
        if: hashFiles('installer-artifact/Engelsiz-Setup.exe') == ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          QA_URL: ${{ inputs.qa_installer_url }}
        run: |
          mkdir -p installer-artifact
          test -n "$QA_URL" || { echo 'QA blocked: no platform installer artifact and empty qa_installer_url'; exit 1; }
          curl -sSL -o installer-artifact/Engelsiz-Setup.exe "$QA_URL"
      - name: Windows installer translation QA
        run: |
          powershell -NoProfile -Command "Unblock-File -Path 'installer-artifact/Engelsiz-Setup.exe'"
          python scripts/check-windows-translation.py --installer installer-artifact/Engelsiz-Setup.exe --report-dir qa-report
        timeout-minutes: 110
      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engelsiz-windows-translation-qa
          path: qa-report/*
          if-no-files-found: error
          retention-days: 14
